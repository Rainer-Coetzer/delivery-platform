global:
  scrape_interval: 5s

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - gateway:8080
          - identity-service:8080
          - merchant-service:8080
          - jobs-service:8080
          - payment-service:8080
          - dispatch-service:8080
          - notification-service:8080
          - reporting-service:8080
