global:
  scrape_interval: 5s

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - gateway:8080
          - customer-service:8080
          - restaurant-service:8080
          - order-service:8080
          - payment-service:8080
          - delivery-service:8080
          - notification-service:8080
          - admin-service:8080
