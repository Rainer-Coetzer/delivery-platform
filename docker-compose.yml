name: delivery-platform

# Two deployment shapes (ADR-0002). Pick one with --profile:
#
#   lite   one platform binary + Postgres/PostGIS + Caddy. The default
#          deployment: fits a small VPS. Default for scripts/e2e.sh.
#   full   the eight microservices + Kafka + observability (Prometheus,
#          Grafana, Jaeger). Same code, EVENTS_BUS=kafka.
#   web    the Flutter web build behind nginx (combine with either).
#
# Postgres has no profile: both shapes need it.
#
# PROFILE=dev allows the insecure local defaults (dev JWT secret, wildcard
# origins). Any other value makes every service refuse to boot unless
# JWT_SECRET and ALLOWED_ORIGINS are properly set (pkg/config/security.go).

x-app-env: &app-env
  PROFILE: ${PROFILE:-dev}
  JWT_SECRET: ${JWT_SECRET:-}
  # Empty: the pack config/brand.yaml names. Set only to demo another pack;
  # every service must run the same one.
  PACK: ${PACK:-}

# One image build for every Go binary; CMD picks which (see Dockerfile).
x-go-service: &go-service
  profiles: ["full"]
  volumes:
    - ./config:/config:ro # the brand profile: edit, then restart
  depends_on:
    postgres: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
    interval: 5s
    timeout: 5s
    retries: 10

x-service-env: &service-env
  <<: *app-env
  EVENTS_BUS: kafka
  KAFKA_BROKERS: kafka:9092
  PORT: "8080" # every microservice listens on 8080 inside its container

services:
  # --- Shared infrastructure ---

  postgres:
    image: postgis/postgis:16-3.4-alpine
    # DEV ONLY: fsync off. First boot writes several databases plus PostGIS,
    # and on Docker Desktop's slow volume I/O the init server's shutdown
    # checkpoint overran pg_ctl's 60s limit, so first boot failed. The
    # entrypoint passes these flags to the init server too. The cost is that
    # a host crash can corrupt this dev database; never copy this flag to a
    # real deployment (docs/OPERATIONS.md, Phase F, has the production settings).
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Our directory replaces the image's own initdb.d, dropping its
      # 10_postgis.sh (a template_postgis DB plus PostGIS in "postgres", which
      # nothing uses). 01-databases.sql creates PostGIS where it's needed.
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # 55432 on the host so it never collides with a locally installed
      # Postgres on 5432. Override with POSTGRES_HOST_PORT.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      # -h 127.0.0.1 forces TCP. During first boot the entrypoint runs the
      # init scripts on a temporary server that only listens on the Unix
      # socket, and a socket check would report healthy mid-init.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Failures during first-boot init don't count towards retries.
      start_period: 120s

  # --- lite: the platform binary behind Caddy ---

  platform:
    profiles: ["lite"]
    build: { context: ., args: { CMD: ./cmd/platform } }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
      EVENTS_BUS: inprocess
      BLOB_DIR: /data/blobs # proof photos and documents; back it up with the database
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - blobs:/data/blobs
      - ./config:/config:ro # the brand profile: edit, then restart
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  caddy:
    profiles: ["lite"]
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep across restarts or hit Let's Encrypt rate limits
    ports:
      # Locally the gateway URL is http://localhost:${GATEWAY_HOST_PORT}. On a
      # server set GATEWAY_HOST_PORT=80 and HTTPS_HOST_PORT=443.
      - "${GATEWAY_HOST_PORT:-8080}:80"
      - "${HTTPS_HOST_PORT:-8443}:443"
    depends_on:
      platform: { condition: service_healthy }
    restart: unless-stopped

  # --- full: microservices + Kafka + observability ---

  # Official Apache image, single-node KRaft (no ZooKeeper). No data volume
  # on purpose: the image runs as a non-root user and a fresh named volume is
  # root-owned. Topics are recreated by kafka-init on every `up`, and
  # consumers are idempotent against Postgres.
  kafka:
    profiles: ["full"]
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw # any 22-char base64 UUID; fixed so restarts reuse the same id
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: internal topics must not ask for 3 replicas or the
      # consumer-group coordinator never comes up.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:29092:29092" # host access (go run, the Kafka contract test); inside the network use kafka:9092
    healthcheck:
      # Each check starts a JVM, so give it room; a 5s timeout flaps.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 15s
      start_period: 20s
      retries: 10

  kafka-init:
    profiles: ["full"]
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./infra/kafka/topics.sh:/topics.sh:ro
    entrypoint: ["/bin/sh", "/topics.sh"]
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_BIN: /opt/kafka/bin
    restart: "no"

  kafka-ui:
    profiles: ["full"]
    image: ghcr.io/kafbat/kafka-ui:v1.3.0 # maintained fork; provectuslabs/kafka-ui is abandoned
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8090:8080"

  identity-service:
    <<: *go-service
    build: { context: ., args: { CMD: ./services/identity/cmd } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://identity:identity@postgres:5432/identity_db?sslmode=disable
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

  merchant-service:
    <<: *go-service
    build: { context: ., args: { CMD: ./services/merchant/cmd } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://merchant:merchant@postgres:5432/merchant_db?sslmode=disable

  jobs-service:
    <<: *go-service
    build: { context: ., args: { CMD: ./services/jobs/cmd } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://jobs:jobs@postgres:5432/jobs_db?sslmode=disable
      MERCHANT_SERVICE_URL: http://merchant-service:8080
      BLOB_DIR: /data/blobs # job documents
    volumes: # a service's own list replaces the anchor's, so the brand mount is repeated
      - job_blobs:/data/blobs
      - ./config:/config:ro

  payment-service:
    <<: *go-service
    build: { context: ., args: { CMD: ./services/payment/cmd } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment_db?sslmode=disable

  dispatch-service:
    <<: *go-service
    build: { context: ., args: { CMD: ./services/dispatch/cmd } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch_db?sslmode=disable
      BLOB_DIR: /data/blobs # proof photos and signatures
    volumes: # a service's own list replaces the anchor's, so the brand mount is repeated
      - dispatch_blobs:/data/blobs
      - ./config:/config:ro

  notification-service:
    <<: *go-service
    build: { context: ., args: { CMD: ./services/notification/cmd } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://notification:notification@postgres:5432/notification_db?sslmode=disable

  reporting-service:
    <<: *go-service
    build: { context: ., args: { CMD: ./services/reporting/cmd } }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://reporting:reporting@postgres:5432/reporting_db?sslmode=disable

  gateway:
    <<: *go-service
    build: { context: ., args: { CMD: ./services/gateway/cmd } }
    environment:
      <<: *service-env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      IDENTITY_SERVICE_URL: http://identity-service:8080
      MERCHANT_SERVICE_URL: http://merchant-service:8080
      JOBS_SERVICE_URL: http://jobs-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      DISPATCH_SERVICE_URL: http://dispatch-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080
    ports: ["${GATEWAY_HOST_PORT:-8080}:8080"] # the only public entry point in `full`
    depends_on:
      identity-service: { condition: service_healthy }
      merchant-service: { condition: service_healthy }
      jobs-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      dispatch-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      reporting-service: { condition: service_healthy }

  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: ["full"]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer # read-only; log in as admin to edit dashboards
    volumes:
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  jaeger:
    profiles: ["full"]
    image: jaegertracing/all-in-one:1.72.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318"   # OTLP HTTP

  # --- web: Flutter web client (build first: cd apps/delivery_app && flutter build web) ---
  web:
    image: nginx:1.29-alpine
    volumes:
      - ./apps/delivery_app/build/web:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:8000:80"]
    profiles: ["web"]

volumes:
  pgdata:
  caddy_data:
  blobs:          # lite: every module's files
  job_blobs:      # full: jobs-service's documents
  dispatch_blobs: # full: dispatch-service's proof
