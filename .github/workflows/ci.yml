name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    # Same PostGIS image as docker-compose.yml, for the -tags=integration
    # tests (pkg/db/dbtest creates a throwaway database per test on it).
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: Unit tests
        run: go test ./... -race -count=1
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags=integration ./... -race -count=1
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/delivery_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform folders
        run: flutter create --platforms=web .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker-build:
    runs-on: ubuntu-latest
    needs: go
    strategy:
      matrix:
        cmd:
          - ./cmd/platform
          - ./services/gateway/cmd
          - ./services/customer/cmd
          - ./services/restaurant/cmd
          - ./services/order/cmd
          - ./services/payment/cmd
          - ./services/delivery/cmd
          - ./services/notification/cmd
          - ./services/admin/cmd
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.cmd }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: CMD=${{ matrix.cmd }}
          push: false
