name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: gofmt check
        run: |
          diff <(gofmt -l .) <(echo -n "")

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/delivery_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform folders
        run: flutter create --platforms=web .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker-build:
    runs-on: ubuntu-latest
    needs: go
    strategy:
      matrix:
        service: [gateway, customer, restaurant, order, payment, delivery, notification, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: delivery-platform/${{ matrix.service }}:ci
