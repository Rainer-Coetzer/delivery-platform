name: delivery_app
description: Customer, driver, restaurant and admin client for the food delivery platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

# Models are plain hand-written classes with fromJson/toJson (see
# lib/models/) rather than freezed/json_serializable, so the app builds
# without a build_runner codegen step.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  web_socket_channel: ^2.4.5
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
